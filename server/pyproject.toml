[project]
name = "agentscratch-server"
version = "0.1.0"
description = "AgentScratch local Agent teaching runtime"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.0",
  "httpx>=0.27",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentscratch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

